[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mihex"
dynamic = ["version"]
description = "MIni Home EXecutor — lightweight smart home management service"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.8"
authors = [{name = "Yonsm"}]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: AsyncIO",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
]
dependencies = [
    "pyyaml>=6.0,<7.0",
    "miservice>=2.0,<4.0",
    "paho-mqtt>=2.0,<3.0",
]

[project.optional-dependencies]
broadlink = ["broadlink>=0.18,<1.0"]
modbus = ["pymodbus>=3.5,<4.0"]
all = ["mihex[broadlink,modbus]"]
dev = ["build", "twine"]

[project.scripts]
mihex = "mihex.__main__:main"

[project.urls]
Homepage = "https://github.com/Yonsm/MiHex"
Repository = "https://github.com/Yonsm/MiHex"
Issues = "https://github.com/Yonsm/MiHex/issues"

[tool.setuptools.dynamic]
version = {attr = "mihex.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["mihex*"]

[tool.setuptools.package-data]
mihex = ["www/*", "conf.yaml.example", "modules/codes/*.yaml"]