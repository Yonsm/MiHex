# MiHex 默认配置样板
#
# 加载顺序：-c 指定 > 当前目录 mihex.yml > ~/.mihex.yml > 可执行文件所在目录 mihex.yml
# 本文件可直接运行，提供一个最小可用实例：仪表盘、天气、本机在线状态。
# 个人配置（账号、Token 等）建议放到 ~/.mihex.yml 或用 -c 指定，避免提交到仓库。
# 模块按配置段的书写顺序加载，删除或注释掉某段即停用对应功能。

server:
  bind: 0.0.0.0
  port: 888
  # token: your_token           # 设置后访问需 HTTP Basic 认证（密码填 token，用户名任意）
  # host: home.example.com      # 对外主机名（DDNS 等），仅用于日志展示
  # key: /root/cert.key
  # cert: /root/cert.crt
  link:
    - NAME: 路由器
      ICON: router-wireless
      LINK: http://192.168.1.1/
    - NAME: 状态
      ICON: code-braces
      LINK: /states
    - NAME: 对象
      ICON: opera
      LINK: /objects
    - NAME: 重新载入
      ICON: reload
      LINK: 'location.reload(true)'
    # TITL: 米和智家             # 仪表盘标题

weather:
  location: 120.15,30.28         # 彩云天气坐标（经度,纬度），默认杭州
  # api_key: YOUR_CAIYUN_API_KEY # 不填则使用内置 Key

ping:
  - NAME: 本机
    ICON: laptop
    DESC: 默认样板示例
    host: 127.0.0.1

tracker:
  fast: 60
  slow: 3600

