server:
  # bind: 0.0.0.0           # 监听地址，默认监听所有接口
  port: 888 # 默认：88
  # host: home.example.com  # 对外主机名（DDNS 等），用于日志显示
  # token: your_token  # 设置后访问需认证（浏览器弹出密码框，密码填此值）
  # key: /root/cert.key
  # cert: /root/cert.crt
  link:
    - NAME: 路由器
      ICON: router-wireless
      LINK: http://192.168.1.1/
    - NAME: 状态列表
      ICON: code-braces
      LINK: '/states?your_token'
    - NAME: 对象列表
      ICON: opera
      LINK: '/objects?your_token'
    - NAME: 重新载入
      ICON: reload
      LINK: location.reload(true)
    # TITL: 米和智家        # 仪表盘标题

