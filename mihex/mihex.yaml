# MiHex 配置示例
# 复制此文件为 conf.yaml 并填入你的设备配置。
#   cp conf.yaml.example conf.yaml

# runner:
#   环境概况: 室内PM2.5为{{MQTT device/zm1/b0f893249132/sensor.PM25}}，温度为{{MQTT device/zm1/b0f893249132/sensor.temperature}}，CO2为客厅{{客厅新风机 co2}}/主卧{{主卧新风机 3-4}}/儿童房{{MQTT JingHuaQi4/co2}}。室外PM2.5为{{MQTT ChuanGanQi/pm2dot5}}，温度为{{MQTT ChuanGanQi/temperature}}。{{天气}}

# ding:
#   token: YOUR_DINGTALK_TOKEN
#   secret: YOUR_DINGTALK_SECRET

# gate:
#   host: localhost
#   port: 8884

weather:
  location: 120.01234,30.56789
  # api_key: YOUR_CAIYUN_API_KEY  # 彩云天气 API Key，默认使用内置 Key

mqtt:
  # host: localhost
  # port: 1883
  weather:
    - NAME: 阳台温度
      UNIT: ℃
      LINK: http://m.nmc.cn/publish/forecast/AZJ/hangzhou.html
      DESC: 中央气象台
      stat: ChuanGanQi/temperature
    - NAME: 阳台湿度
      UNIT: '%'
      LINK: 'https://m.weathercn.com/index.do?id=106832'
      DESC: 杭州天气
      stat: ChuanGanQi/humidity
    - NAME: 阳台空气质量
      UNIT: aqi
      LINK: https://www.lewei50.com/u/g/34131
      DESC: 室外传感器
      stat: ChuanGanQi/pm2dot5
  sensor:
    - NAME: 餐厅温度
      UNIT: ℃
      stat: device/zm1/b0f893249132/sensor
      json: temperature
    - NAME: 餐厅湿度
      UNIT: '%'
      stat: device/zm1/b0f893249132/sensor
      json: humidity
    - NAME: 餐厅空气质量
      UNIT: aqi
      stat: device/zm1/b0f893249132/sensor
      json: PM25
    - NAME: 餐厅甲醛
      UNIT: hcho
      stat: device/zm1/b0f893249132/sensor
      json: formaldehyde

